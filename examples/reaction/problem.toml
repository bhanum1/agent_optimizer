name = "Cross-coupling yield"
description = """
Palladium-catalysed cross-coupling of an aryl bromide with a boronic acid,
run in parallel reaction blocks of up to 8 vials. Yield is measured by HPLC
against an internal standard. Very hot, long runs can decompose to tar and
give no usable measurement; those vials are recorded as failed. Catalyst is
expensive, so lower loading is preferred when yields are similar.
"""
noise = "low"

[objective]
name = "yield"
direction = "maximize"

[budget]
total = 40
block_size = 8

[[parameters]]
name = "temperature"
type = "continuous"
low = 40
high = 120
unit = "C"

[[parameters]]
name = "catalyst"
type = "continuous"
low = 0.1
high = 5.0
log = true
unit = "mol%"

[[parameters]]
name = "base_equiv"
type = "continuous"
low = 1.0
high = 4.0
unit = "equiv"

[[parameters]]
name = "hours"
type = "integer"
low = 1
high = 24
unit = "h"
