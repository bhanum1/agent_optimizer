[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aobench"
version = "0.2.0"
description = "A small benchmark showing that every baseline optimizer fails somewhere."
readme = "benchmark/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "ioh",
    "cma",
    "botorch",
    "smac",
    "nevergrad",
]

[tool.uv]
# Same optimizer versions as the skill's own constraints.
constraint-dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "ioh==0.3.22",
    "cma==4.5.0",
    "botorch==0.18.1",
    "gpytorch==1.15.2",
    "torch==2.14.1",
    "smac==2.4.1",
    "nevergrad==1.0.12",
    "configspace==1.2.2",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["benchmark/src"]
