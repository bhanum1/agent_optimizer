[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aobench"
version = "0.1.0"
description = "Benchmark for the agentoptimizer skill: tasks, baselines and a sandboxed runner that plays the user."
readme = "benchmark/README.md"
requires-python = ">=3.11"
# Evaluator environment (.venv): the benchmark, its baselines, the BBOB backend, and the
# skill's core (aoptcore) that the runner drives. smac is a baseline only.
dependencies = [
    "agentoptimizer-skill",
    "numpy",
    "scipy",
    "ioh",
    "cma",
    "botorch",
    "Py-BOBYQA",
    "smac",
]

[project.optional-dependencies]
# Objective backends for the CEC, G-suite, COCO, Nevergrad and YAHPO task families.
# opfunu still imports pkg_resources, which setuptools 81 removed.
backends = ["opfunu", "setuptools<81", "pymoo", "coco-experiment", "nevergrad", "onnxruntime"]

[tool.uv.sources]
agentoptimizer-skill = { path = "skill/agentoptimizer", editable = true }

[tool.uv]
# Versions of the environments behind the published runs (pre-manuscript-snapshot).
constraint-dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "ioh==0.3.22",
    "cma==4.5.0",
    "botorch==0.18.1",
    "gpytorch==1.15.2",
    "torch==2.14.1",
    "py-bobyqa==1.5.0",
    "smac==2.4.1",
    "configspace==1.2.2",
    "scikit-learn==1.9.1",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "opfunu==1.0.1",
    "pymoo==0.6.1.6",
    "coco-experiment==2.8.2",
    "nevergrad==1.0.12",
    "onnxruntime==1.31.0",
]

[tool.setuptools.packages.find]
where = ["benchmark/src"]
