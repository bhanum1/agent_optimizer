[project]
name = "agentoptimizer-skill"
version = "0.1.0"
description = "The agentoptimizer skill: an agent chooses the optimizer for each block of a black-box campaign."
requires-python = ">=3.11"
# The optimizer runtime: the core (aoptcore) and the packages the agent's optimizers may use.
dependencies = ["numpy", "scipy", "cma", "botorch", "Py-BOBYQA", "pandas", "matplotlib", "pyyaml"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["aoptcore"]

[tool.uv]
constraint-dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "cma==4.5.0",
    "botorch==0.18.1",
    "gpytorch==1.15.2",
    "torch==2.14.1",
    "py-bobyqa==1.5.0",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
